<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>iPhone Invader</title>
<style>
  :root { --bg:#05070d; --fg:#f3f7ff; --accent:#62ff8f; --danger:#ff5f6d; }
  * {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
  }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  html, body {
    touch-action:none;
    overscroll-behavior:none;
  }
  body {
    touch-action:none;
    -webkit-text-size-adjust:100%;
  }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #hud { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-weight:700; font-size:14px; }
  #gameArea { position:relative; flex:1; min-height:0; }
  canvas { display:block; width:100%; height:100%; background:linear-gradient(#05070d,#090e1b); }
  #overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    background:rgba(0,0,0,.45); padding:24px;
  }
  #panel { max-width:360px; }
  h1 { margin:0 0 8px; font-size:34px; letter-spacing:1px; }
  p { margin:8px 0 18px; line-height:1.5; opacity:.9; }
  #soundBtn{padding:6px 9px;border-radius:10px;font-size:18px;line-height:1;background:rgba(255,255,255,.08);color:#fff;box-shadow:none}
  button {
    border:0; border-radius:14px; padding:14px 22px; font-size:18px; font-weight:800;
    color:#07110b; background:var(--accent); box-shadow:0 8px 24px rgba(98,255,143,.25);
  }
  #controls {
    height:128px; display:grid; grid-template-columns:1fr 1fr 1.15fr; gap:12px; padding:12px 14px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.35));
  }
  .ctrl {
    display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07); border-radius:22px; font-size:36px; font-weight:900;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none;
  }
  #fire {
    background:rgba(98,255,143,.13); color:var(--accent); font-size:24px;
    touch-action:none;
  }
  button, #controls, canvas, #gameArea {
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .hidden { display:none !important; }
  @media (min-width:700px) { #wrap { max-width:520px; left:50%; transform:translateX(-50%); } }
</style>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#05070d">
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>LEVEL <span id="level">1</span></div>
    <div>LIFE <span id="life">3</span></div><button id="soundBtn" aria-label="sound">🔊</button>
  </div>
  <div id="gameArea">
    <canvas id="c"></canvas>
    <div id="overlay">
      <div id="panel">
        <h1>INVADER <small style="font-size:12px;opacity:.65">v7</small></h1>
        <p>左右ボタンで移動、FIREで射撃。<br>3拍子で迫るインベーダーとUFOを撃破せよ！<br>500点で盆踊り射撃、1000点で巨大イカ神輿！</p>
        <button id="startBtn">START</button>
      </div>
    </div>
  </div>
  <div id="controls">
    <div class="ctrl" id="left">◀</div>
    <div class="ctrl" id="right">▶</div>
    <div class="ctrl" id="fire">FIRE</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const lifeEl = document.getElementById('life');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const startBtn = document.getElementById('startBtn');
  const leftBtn = document.getElementById('left');
  const rightBtn = document.getElementById('right');
  const fireBtn = document.getElementById('fire');
  const soundBtn = document.getElementById('soundBtn');

  let W=0,H=0,dpr=1,last=0,running=false;
  let left=false,right=false,fire=false,fireCooldown=0;
  let score=0,level=1,lives=3;
  let player, bullets=[], enemyBullets=[], invaders=[], stars=[];
  let ufo=null, ufoTimer=5;
  let bonusDanceActive=false, bonusDanceTimer=0, nextDanceScore=500, danceSquids=[];
  let giantSquidActive=false, giantSquidTimer=0, giantSquidHP=0, giantSquid=null, bonusHits=0;
  let swarmDir=1, swarmSpeed=26, shootTimer=0;
  let invaderStepTimer=0, invaderStepInterval=.34;


  let audioCtx=null, masterGain=null, soundOn=true, stepBeat=0, ufoOsc=null, ufoGain=null;

  function initAudio(){
    try{
      if(audioCtx){
        if(audioCtx.state==='suspended'){
          const r=audioCtx.resume();
          if(r && r.catch) r.catch(()=>{});
        }
        return;
      }
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      audioCtx=new AC();
      masterGain=audioCtx.createGain();
      masterGain.gain.value=.24;
      masterGain.connect(audioCtx.destination);
    }catch(e){
      audioCtx=null;
      masterGain=null;
    }
  }
  function tone(freq,duration,type='square',volume=.12,slideTo=null){
    if(!soundOn) return;
    initAudio();
    if(!audioCtx) return;
    const now=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,now);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),now+duration);
    g.gain.setValueAtTime(volume,now);
    g.gain.exponentialRampToValueAtTime(.0001,now+duration);
    o.connect(g); g.connect(masterGain); o.start(now); o.stop(now+duration+.02);
  }
  function noise(duration=.12,volume=.08){
    if(!soundOn) return;
    initAudio(); if(!audioCtx) return;
    const sr=audioCtx.sampleRate, b=audioCtx.createBuffer(1,Math.floor(sr*duration),sr), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=audioCtx.createBufferSource(), g=audioCtx.createGain();
    g.gain.value=volume; s.buffer=b; s.connect(g); g.connect(masterGain); s.start();
  }
  function sfxShoot(){ tone(760,.055,'square',.13,300); }
  function sfxHit(){ tone(190,.085,'sawtooth',.15,70); noise(.07,.05); }
  function sfxPlayerHit(){ tone(120,.24,'sawtooth',.18,45); noise(.22,.11); }
  function sfxUfoHit(){ tone(520,.08,'square',.14,180); setTimeout(()=>tone(820,.11,'square',.12,260),55); }
  function sfxLevel(){ tone(440,.08); setTimeout(()=>tone(660,.08),90); setTimeout(()=>tone(880,.13),180); }
  function sfxInvaderStep(){
    const notes=[92,78,66];
    tone(notes[stepBeat%3],.055,'square',.095);
    stepBeat=(stepBeat+1)%3;
  }

  function sfxBonOdori(){
    const seq=[330,392,440,392,330,294,330,392];
    seq.forEach((f,i)=>setTimeout(()=>tone(f,.11,'square',.09),i*125));
  }

  function sfxGiantSquid(){
    const seq=[110,147,196,147,110,98,110,147];
    seq.forEach((f,i)=>setTimeout(()=>tone(f,.14,i%2?'square':'sawtooth',.10),i*120));
  }
  function sfxBonusHit(){ tone(620,.045,'square',.10,880); }
  function sfxGiantHit(){ tone(150,.06,'sawtooth',.13,90); }
  function sfxGiantDown(){ [392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.11,'square',.12),i*80)); }

  function startUfoHum(){
    if(!soundOn) return;
    initAudio(); if(!audioCtx||ufoOsc) return;
    ufoOsc=audioCtx.createOscillator(); ufoGain=audioCtx.createGain();
    ufoOsc.type='sawtooth'; ufoOsc.frequency.value=155; ufoGain.gain.value=.025;
    ufoOsc.connect(ufoGain); ufoGain.connect(masterGain); ufoOsc.start();
  }
  function stopUfoHum(){
    if(!ufoOsc) return;
    try{ufoOsc.stop();}catch(e){}
    ufoOsc=null; ufoGain=null;
  }

  function resize(){
    const r=canvas.getBoundingClientRect();
    dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.floor(r.width*dpr);
    canvas.height=Math.floor(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W=r.width; H=r.height;
    makeStars();
    if(player) player.y=H-42;
  }
  addEventListener('resize',resize);
  resize();

  function makeStars(){
    stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.3}));
  }

  function init(){
    score=0; level=1; lives=3; bullets=[]; enemyBullets=[]; ufo=null; ufoTimer=4; bonusDanceActive=false; bonusDanceTimer=0; nextDanceScore=500; danceSquids=[]; giantSquidActive=false; giantSquidTimer=0; giantSquidHP=0; giantSquid=null; bonusHits=0;
    player={x:W/2-18,y:H-42,w:36,h:22,speed:260};
    updateHUD();
    buildLevel();
  }

  function buildLevel(){
    bullets=[]; enemyBullets=[]; invaders=[];
    swarmDir=1; swarmSpeed=42+level*10; shootTimer=.6; invaderStepTimer=0; stepBeat=0; invaderStepInterval=Math.max(.105,.34-level*.018);
    const cols=Math.min(9,6+Math.floor(level/2));
    const rows=Math.min(6,3+Math.floor(level/3));
    const gap=8, iw=30, ih=22;
    const total=cols*iw+(cols-1)*gap;
    const startX=(W-total)/2;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        invaders.push({x:startX+c*(iw+gap),y:34+r*32,w:iw,h:ih,alive:true,row:r});
      }
    }
  }

  function updateHUD(){
    scoreEl.textContent=score;
    levelEl.textContent=level;
    lifeEl.textContent=lives;
  }

  function rectHit(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function shoot(){
    if(fireCooldown<=0 && bullets.length<3){
      bullets.push({x:player.x+player.w/2-2,y:player.y-10,w:4,h:12,vy:-430});
      sfxShoot();
      fireCooldown=.18;
    }
  }

  function enemyShoot(){
    const alive=invaders.filter(i=>i.alive);
    if(!alive.length) return;
    const shooter=alive[Math.floor(Math.random()*alive.length)];
    enemyBullets.push({x:shooter.x+shooter.w/2-2,y:shooter.y+shooter.h,w:4,h:10,vy:170+level*12});
  }


  function checkBonusEvent(){
    if(bonusDanceActive || giantSquidActive) return;
    if(score < nextDanceScore) return;

    const threshold = nextDanceScore;
    nextDanceScore += 500;

    if(threshold % 1000 === 0) startGiantSquidDance();
    else startBonusDance();
  }

  function startBonusDance(){
    if(bonusDanceActive || giantSquidActive) return;
    bonusDanceActive=true;
    bonusDanceTimer=5.0;
    bonusHits=0;
    bullets=[];
    enemyBullets=[];
    danceSquids=[];
    const count=7;
    for(let i=0;i<count;i++){
      danceSquids.push({
        x:W*(i+1)/(count+1),
        y:H*.28+(i%2)*42,
        phase:i*.7,
        size:23+(i%3)*3,
        alive:true,
        respawn:0
      });
    }
    sfxBonOdori();
    if(navigator.vibrate) navigator.vibrate([20,40,20,40,20]);
  }

  function startGiantSquidDance(){
    if(bonusDanceActive || giantSquidActive) return;
    giantSquidActive=true;
    giantSquidTimer=7.0;
    giantSquidHP=12;
    bonusHits=0;
    bullets=[];
    enemyBullets=[];
    giantSquid={x:W/2-55,y:H*.18,w:110,h:82,phase:0,flash:0};
    sfxGiantSquid();
    if(navigator.vibrate) navigator.vibrate([40,40,40,40,80]);
  }

  function updateBonusGame(dt){
    if(!(bonusDanceActive || giantSquidActive)) return false;

    fireCooldown-=dt;
    if(left) player.x-=player.speed*dt;
    if(right) player.x+=player.speed*dt;
    player.x=Math.max(4,Math.min(W-player.w-4,player.x));
    if(fire) shoot();

    bullets.forEach(b=>b.y+=b.vy*dt);
    bullets=bullets.filter(b=>b.y+b.h>0 && b.y>-100);

    if(bonusDanceActive){
      bonusDanceTimer-=dt;

      danceSquids.forEach(q=>{
        if(!q.alive){
          q.respawn-=dt;
          if(q.respawn<=0){
            q.x=35+Math.random()*(W-70);
            q.y=H*.22+Math.random()*H*.28;
            q.phase=Math.random()*6.28;
            q.alive=true;
          }
        }
      });

      bullets.forEach(b=>{
        danceSquids.forEach(q=>{
          if(!q.alive) return;
          const t=performance.now()/180+q.phase;
          const target={
            x:q.x+Math.sin(t)*6-q.size*.42,
            y:q.y+Math.cos(t*1.25)*4-q.size*.38,
            w:q.size*.84,
            h:q.size*.80
          };
          if(rectHit(b,target)){
            b.y=-999;
            q.alive=false;
            q.respawn=.18;
            bonusHits++;
            score+=25;
            updateHUD();
            sfxBonusHit();
            if(navigator.vibrate) navigator.vibrate(8);
          }
        });
      });

      bullets=bullets.filter(b=>b.y>-100);

      if(bonusDanceTimer<=0){
        bonusDanceActive=false;
        danceSquids=[];
        bullets=[];
        score+=100;
        updateHUD();
        checkBonusEvent();
      }
      return true;
    }

    giantSquidTimer-=dt;
    if(giantSquid){
      giantSquid.phase+=dt*5;
      giantSquid.flash=Math.max(0,giantSquid.flash-dt);
      giantSquid.x=W/2-giantSquid.w/2+Math.sin(giantSquid.phase*.7)*36;
      giantSquid.y=H*.16+Math.abs(Math.sin(giantSquid.phase))*38;

      bullets.forEach(b=>{
        if(giantSquid && rectHit(b,giantSquid)){
          b.y=-999;
          giantSquidHP--;
          bonusHits++;
          score+=20;
          giantSquid.flash=.10;
          updateHUD();
          sfxGiantHit();
          if(navigator.vibrate) navigator.vibrate(12);

          if(giantSquidHP<=0){
            score+=300;
            updateHUD();
            sfxGiantDown();
            giantSquidActive=false;
            giantSquid=null;
            bullets=[];
            checkBonusEvent();
          }
        }
      });
    }

    bullets=bullets.filter(b=>b.y>-100);

    if(giantSquidActive && giantSquidTimer<=0){
      giantSquidActive=false;
      giantSquid=null;
      bullets=[];
      score+=100;
      updateHUD();
      checkBonusEvent();
    }
    return true;
  }

  function drawSquid(x,y,s,phase){
    const t=performance.now()/180+phase;
    const sway=Math.sin(t)*6;
    const bob=Math.cos(t*1.25)*4;
    ctx.save();
    ctx.translate(x+sway,y+bob);
    ctx.rotate(Math.sin(t)*0.18);
    ctx.fillStyle='#ffd966';
    ctx.fillRect(-s*.32,-s*.38,s*.64,s*.42);
    ctx.fillRect(-s*.42,-s*.12,s*.84,s*.34);
    ctx.fillStyle='#05070d';
    ctx.fillRect(-s*.18,-s*.18,s*.1,s*.1);
    ctx.fillRect(s*.08,-s*.18,s*.1,s*.1);
    ctx.fillStyle='#ffd966';
    // 盆踊りっぽい左右の腕
    const arm=Math.sin(t*1.4)*8;
    ctx.fillRect(-s*.58,-s*.06+arm*.15,s*.18,s*.12);
    ctx.fillRect(s*.40,-s*.06-arm*.15,s*.18,s*.12);
    // 足
    ctx.fillRect(-s*.28,s*.20,s*.12,s*.22);
    ctx.fillRect(-s*.05,s*.20,s*.12,s*.25);
    ctx.fillRect(s*.18,s*.20,s*.12,s*.22);
    ctx.restore();
  }


  function drawGiantSquid(g){
    const t=performance.now()/180;
    const s=g.w;
    ctx.save();
    ctx.translate(g.x+g.w/2,g.y+g.h/2);
    ctx.rotate(Math.sin(t*.8)*.08);
    ctx.fillStyle=g.flash>0?'#ffffff':'#ffb347';
    ctx.fillRect(-s*.28,-s*.30,s*.56,s*.27);
    ctx.fillRect(-s*.38,-s*.06,s*.76,s*.30);
    ctx.fillRect(-s*.48,s*.17,s*.96,s*.10);
    ctx.fillStyle='#05070d';
    ctx.fillRect(-s*.17,-s*.11,s*.08,s*.08);
    ctx.fillRect(s*.09,-s*.11,s*.08,s*.08);
    ctx.fillStyle=g.flash>0?'#ffffff':'#ffb347';
    const arm=Math.sin(t*1.5)*13;
    ctx.fillRect(-s*.60,-s*.02+arm*.18,s*.20,s*.11);
    ctx.fillRect(s*.40,-s*.02-arm*.18,s*.20,s*.11);
    for(let i=-3;i<=3;i++){
      const yy=s*.28+Math.sin(t*1.4+i)*5;
      ctx.fillRect(i*s*.075-s*.035,yy,s*.07,s*.24+(i%2?8:0));
    }
    ctx.fillStyle='#ffe08a';
    ctx.fillRect(-s*.68,s*.33,s*1.36,s*.06);
    ctx.restore();
  }

  function update(dt){
    if(updateBonusGame(dt)) return;
    fireCooldown-=dt;
    if(left) player.x-=player.speed*dt;
    if(right) player.x+=player.speed*dt;
    player.x=Math.max(4,Math.min(W-player.w-4,player.x));
    if(fire) shoot();

    bullets.forEach(b=>b.y+=b.vy*dt);
    enemyBullets.forEach(b=>b.y+=b.vy*dt);
    bullets=bullets.filter(b=>b.y+b.h>0);
    enemyBullets=enemyBullets.filter(b=>b.y<H+20);

    // 3拍子でデッ・デッ・デッと刻むステップ移動
    invaderStepTimer-=dt;
    if(invaderStepTimer<=0){
      const aliveNow=invaders.filter(i=>i.alive);
      if(aliveNow.length){
        let minX=Infinity,maxX=-Infinity;
        aliveNow.forEach(i=>{minX=Math.min(minX,i.x);maxX=Math.max(maxX,i.x+i.w);});
        const stepPx=Math.min(18,7+level*.65+(1-aliveNow.length/invaders.length)*5);
        let drop=false;
        if((swarmDir>0 && maxX+stepPx>W-6) || (swarmDir<0 && minX-stepPx<6)){swarmDir*=-1;drop=true;}
        aliveNow.forEach(i=>{if(drop)i.y+=18;else i.x+=swarmDir*stepPx;});
        sfxInvaderStep();
        const ratio=aliveNow.length/Math.max(1,invaders.length);
        invaderStepInterval=Math.max(.085,(.34-level*.016)*(.48+ratio*.52));
      }
      invaderStepTimer=invaderStepInterval;
    }

    bullets.forEach(b=>{
      invaders.forEach(i=>{
        if(i.alive && rectHit(b,i)){
          i.alive=false; b.y=-999; score+=10*(i.row+1); updateHUD(); sfxHit();
          checkBonusEvent();
          if(navigator.vibrate) navigator.vibrate(10);
        }
      });
    });
    bullets=bullets.filter(b=>b.y>-100);

    enemyBullets.forEach(b=>{
      if(rectHit(b,player)){
        b.y=H+999; lives--; updateHUD(); sfxPlayerHit();
        if(navigator.vibrate) navigator.vibrate([30,40,30]);
        if(lives<=0) return gameOver();
      }
    });

    if(invaders.some(i=>i.alive && i.y+i.h>=player.y-4)) return gameOver();

    if(!invaders.some(i=>i.alive)){
      level++; updateHUD(); sfxLevel(); buildLevel();
    }

    // UFO
    ufoTimer -= dt;
    if(!ufo && ufoTimer <= 0){
      const fromLeft = Math.random() < .5;
      ufo = {
        x: fromLeft ? -48 : W+48,
        y: 8 + Math.random()*18,
        w: 44, h: 18,
        vx: (fromLeft ? 1 : -1) * (120 + level*8 + Math.random()*50)
      };
      ufoTimer = 9 + Math.random()*9;
      startUfoHum();
    }
    if(ufo){
      ufo.x += ufo.vx*dt;
      if(ufo.x < -70 || ufo.x > W+70){ufo=null;stopUfoHum();}
    }

    bullets.forEach(b=>{
      if(ufo && rectHit(b,ufo)){
        score += 150 + level*25;
        checkBonusEvent();
        b.y = -999;
        ufo = null;
        stopUfoHum(); sfxUfoHit();
        ufoTimer = 7 + Math.random()*8;
        updateHUD();
        if(navigator.vibrate) navigator.vibrate([20,20,20]);
      }
    });

    shootTimer-=dt;
    if(shootTimer<=0){
      enemyShoot();
      shootTimer=Math.max(.18,.82-level*.05)+Math.random()*.42;
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.8)';
    for(const s of stars) ctx.fillRect(s.x,s.y,s.s,s.s);

    // player
    ctx.fillStyle='#62ff8f';
    ctx.fillRect(player.x+10,player.y,16,6);
    ctx.fillRect(player.x+4,player.y+6,28,8);
    ctx.fillRect(player.x,player.y+14,36,8);

    // bullets
    ctx.fillStyle='#f8ff74';
    bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
    ctx.fillStyle='#ff6b78';
    enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

    // UFO
    if(ufo){
      ctx.fillStyle='#ff4fd8';
      ctx.fillRect(ufo.x+10,ufo.y,ufo.w-20,4);
      ctx.fillRect(ufo.x+4,ufo.y+4,ufo.w-8,6);
      ctx.fillRect(ufo.x,ufo.y+10,ufo.w,5);
      ctx.fillStyle='#fff';
      ctx.fillRect(ufo.x+10,ufo.y+7,5,3);
      ctx.fillRect(ufo.x+ufo.w-15,ufo.y+7,5,3);
    }

    // invaders
    invaders.forEach(i=>{
      if(!i.alive) return;
      ctx.fillStyle = i.row%3===0 ? '#9b8cff' : i.row%3===1 ? '#58d7ff' : '#ff9b54';
      const x=i.x,y=i.y,w=i.w,h=i.h;
      ctx.fillRect(x+6,y,w-12,4);
      ctx.fillRect(x+2,y+4,w-4,12);
      ctx.fillRect(x,y+8,4,8);
      ctx.fillRect(x+w-4,y+8,4,8);
      ctx.fillStyle='#05070d';
      ctx.fillRect(x+8,y+8,4,4);
      ctx.fillRect(x+w-12,y+8,4,4);
      ctx.fillStyle='#fff';
      ctx.fillRect(x+4,y+h-4,6,4);
      ctx.fillRect(x+w-10,y+h-4,6,4);
    });

    if(bonusDanceActive){
      ctx.fillStyle='rgba(0,0,0,.42)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle='#fff';
      ctx.font='900 24px -apple-system,BlinkMacSystemFont,sans-serif';
      ctx.fillText('BONUS! イカの盆踊り',W/2,H*.12);
      ctx.font='700 15px -apple-system,BlinkMacSystemFont,sans-serif';
      ctx.fillText('踊るイカを撃て！ 1匹 +25点',W/2,H*.17);
      ctx.fillText('HIT '+bonusHits+'   残り '+Math.max(0,bonusDanceTimer).toFixed(1)+'秒',W/2,H*.21);
      danceSquids.forEach(q=>{if(q.alive) drawSquid(q.x,q.y,q.size,q.phase);});
      ctx.textAlign='start';
    }

    if(giantSquidActive && giantSquid){
      ctx.fillStyle='rgba(0,0,0,.48)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign='center';
      ctx.fillStyle='#fff';
      ctx.font='900 23px -apple-system,BlinkMacSystemFont,sans-serif';
      ctx.fillText('1000点祭！ 巨大イカ神輿',W/2,H*.08);
      ctx.font='700 15px -apple-system,BlinkMacSystemFont,sans-serif';
      ctx.fillText('上下に踊る巨大イカを撃て！',W/2,H*.12);
      ctx.fillText('HP '+Math.max(0,giantSquidHP)+'/12   HIT '+bonusHits+'   '+Math.max(0,giantSquidTimer).toFixed(1)+'秒',W/2,H*.16);
      drawGiantSquid(giantSquid);
      ctx.textAlign='start';
    }

  }

  function loop(t){
    if(!running) return;
    const dt=Math.min((t-last)/1000,.033); last=t;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  function start(e){
    if(e && e.preventDefault) e.preventDefault();
    try{ initAudio(); }catch(err){}
    init();
    overlay.classList.add('hidden');
    running=true;
    last=performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver(){
    running=false; stopUfoHum();
    panel.innerHTML=`<h1>GAME OVER</h1><p>SCORE ${score}<br>LEVEL ${level}</p><button id="retry">RETRY</button>`;
    overlay.classList.remove('hidden');
    document.getElementById('retry').onclick=()=>{
      panel.innerHTML='<h1>INVADER</h1><p>左右ボタンで移動、FIREで射撃。<br>3拍子で迫るインベーダーとUFOを撃破せよ！<br>500点で盆踊り射撃、1000点で巨大イカ神輿！</p><button id="startBtn2">START</button>';
      document.getElementById('startBtn2').onclick=start;
      start();
    };
  }

  function bindHold(el,setter){
    const on=e=>{ if(e && e.cancelable) e.preventDefault(); setter(true); try{initAudio();}catch(err){} };
    const off=e=>{ if(e && e.cancelable) e.preventDefault(); setter(false); };

    if(window.PointerEvent){
      el.addEventListener('pointerdown',on,{passive:false});
      el.addEventListener('pointerup',off,{passive:false});
      el.addEventListener('pointercancel',off,{passive:false});
      el.addEventListener('pointerleave',off,{passive:false});
    }else{
      el.addEventListener('touchstart',on,{passive:false});
      el.addEventListener('touchend',off,{passive:false});
      el.addEventListener('touchcancel',off,{passive:false});
      el.addEventListener('mousedown',on);
      el.addEventListener('mouseup',off);
      el.addEventListener('mouseleave',off);
    }
  }
  bindHold(leftBtn,v=>left=v);
  bindHold(rightBtn,v=>right=v);
  bindHold(fireBtn,v=>fire=v);

  // iPhone Safari: ゲーム操作中のダブルタップ拡大を防止
  let lastTouchEnd=0;
  document.addEventListener('touchend',e=>{
    const now=Date.now();
    if(now-lastTouchEnd<=350 && e.cancelable) e.preventDefault();
    lastTouchEnd=now;
  },{passive:false});

  document.addEventListener('dblclick',e=>{
    if(e.cancelable) e.preventDefault();
  },{passive:false});

  ['gesturestart','gesturechange','gestureend'].forEach(type=>{
    document.addEventListener(type,e=>{
      if(e.cancelable) e.preventDefault();
    },{passive:false});
  });

  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') left=true;
    if(e.key==='ArrowRight') right=true;
    if(e.key===' '){fire=true;e.preventDefault();}
  });
  addEventListener('keyup',e=>{
    if(e.key==='ArrowLeft') left=false;
    if(e.key==='ArrowRight') right=false;
    if(e.key===' ') fire=false;
  });

  soundBtn.onclick=()=>{
    initAudio(); soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇';
    if(!soundOn) stopUfoHum(); else if(ufo) startUfoHum();
  };
  startBtn.onclick=start;
  startBtn.addEventListener('touchend',start,{passive:false});
  draw = draw.bind(null);
})();
</script>
<script>
/* v6: service worker intentionally disabled to avoid stale iPhone Safari cache. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
  });
}
</script>
</body>
</html>
